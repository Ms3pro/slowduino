; PlatformIO config para builds locais de teste (Uno/Nano e Mega2560).
; Não faz parte do fluxo oficial do projeto (que usa Arduino IDE), só serve
; para gerar .hex reproduzíveis pra simulação (PICSimLab) e diagnóstico.
[platformio]
src_dir = slowduino

[env]
framework = arduino
build_flags = -Wall

[env:uno]
platform = atmelavr
board = uno

; Build de diagnóstico: habilita o log serial (DEBUG_ENABLED) para
; investigar o bug de ignição no banco de testes. Não afeta o env:uno normal.
[env:uno_debug]
platform = atmelavr
board = uno
build_flags = -Wall -DDEBUG_ENABLED

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags = -DBOARD_SPEEDUINO_V04

; Porte para STM32F103C8T6 "Blue Pill" (framework Arduino via
; Arduino_Core_STM32 / STM32duino). Ver board_config.h para pinagem.
; USB CDC habilitada: `Serial` vira a USB nativa (PA11/PA12), que é onde o
; TunerStudio conecta. Sem isso o Serial cai na USART2 (PA2/PA3).
[env:bluepill]
platform = ststm32
board = genericSTM32F103C8
build_flags =
  -DBOARD_STM32_BLUEPILL
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DUSBCON
  -DUSBD_USE_CDC

; Build de diagnóstico da issue #4 (STM32 não responde no TunerStudio).
; Mesmo firmware do bluepill + LED PC13 mostrando o progresso do setup() e o
; estado do loop/USB, texto "DIAG" na USB e na USART2 (PA2/PA3). Ver diag.h.
[env:bluepill_diag]
extends = env:bluepill
build_flags =
  ${env:bluepill.build_flags}
  -DDIAG_BUILD
